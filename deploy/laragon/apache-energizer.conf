# Laragon2 — Sapelli (Quasar) sur le port 82
# DocumentRoot : C:\laragon2\www\sapelli
#
# Copier vers : C:\laragon2\etc\apache2\sites-enabled\sapelli.conf
# Créer avant le 1er démarrage : C:\laragon2\logs et C:\laragon2\www\sapelli
# Puis redémarrer Apache Laragon2.

<VirtualHost *:82>
    ServerName 172.17.15.121

    DocumentRoot "C:/laragon2/www/sapelli"
    <Directory "C:/laragon2/www/sapelli">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        # index.html ne doit pas rester en cache (sinon anciens bundles JS)
        <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </Files>
    </Directory>

    ProxyPreserveHost On

    ProxyPass        /api-cnps/ http://127.0.0.1:8020/
    ProxyPassReverse /api-cnps/ http://127.0.0.1:8020/

    ProxyPass        /tele-immat/ http://127.0.0.1:8080/teleImmat_0.1/
    ProxyPassReverse /tele-immat/ http://127.0.0.1:8080/teleImmat_0.1/

    ProxyPass        /EnergizerDev/ http://127.0.0.1:8080/EnergizerDev/
    ProxyPassReverse /EnergizerDev/ http://127.0.0.1:8080/EnergizerDev/

    ErrorLog  "C:/laragon2/logs/sapelli-error.log"
    CustomLog "C:/laragon2/logs/sapelli-access.log" common
</VirtualHost>
