# Laragon — Sapelli (Quasar) sur le port 82
# DocumentRoot : C:\laragon\www\sapelli
#
# Copier vers : C:\laragon\etc\apache2\sites-enabled\sapelli.conf

<VirtualHost *:82>
    ServerName 172.17.15.121

    DocumentRoot "C:/laragon/www/sapelli"
    <Directory "C:/laragon/www/sapelli">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On

    ProxyPass        /api-cnps/ http://127.0.0.1:8020/
    ProxyPassReverse /api-cnps/ http://127.0.0.1:8020/

    ProxyPass        /tele-immat/ http://127.0.0.1:8080/teleImmat_0.1/
    ProxyPassReverse /tele-immat/ http://127.0.0.1:8080/teleImmat_0.1/

    ProxyPass        /EnergizerDev/ http://127.0.0.1:8080/EnergizerDev/
    ProxyPassReverse /EnergizerDev/ http://127.0.0.1:8080/EnergizerDev/

    ErrorLog  "C:/laragon/logs/sapelli-error.log"
    CustomLog "C:/laragon/logs/sapelli-access.log" common
</VirtualHost>
