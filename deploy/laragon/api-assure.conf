# Laragon 6 / Laragon2 — API PHP backend-assure sur le port 83
# DocumentRoot : C:\laragon2\www\api-assure\public
#
# Installation sur le serveur 172.17.15.121 :
#   1. Copier ce fichier vers :
#        C:\laragon2\etc\apache2\sites-enabled\api-assure.conf
#   2. Dans C:\laragon2\etc\apache2\httpd.conf (ou ports.conf inclus),
#      ajouter si absent :
#        Listen 83
#   3. Créer le dossier logs si besoin :
#        C:\laragon2\logs
#   4. Redémarrer Apache (Laragon → Stop All → Start All)
#
# Test :
#   curl http://127.0.0.1:83/health
#   curl -X POST http://127.0.0.1:83/auth/login -H "Content-Type: application/json" -d "{\"num_assu\":\"...\",\"mot2passe\":\"...\"}"
#
# Frontend Quasar (port 82) : VITE_ASSURE_API_USE_PROXY=false
#   VITE_ASSURE_API_BASE_URL=http://172.17.15.121:83

<VirtualHost *:83>
    ServerName 172.17.15.121

    DocumentRoot "C:/laragon2/www/api-assure/public"
    <Directory "C:/laragon2/www/api-assure/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Transmettre Authorization à PHP (jeton Bearer /auth/me, /assure/home)
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog  "C:/laragon2/logs/api-assure-error.log"
    CustomLog "C:/laragon2/logs/api-assure-access.log" common
</VirtualHost>
